aid: okra-africa
url: https://raw.githubusercontent.com/api-evangelist/okra-africa/refs/heads/main/apis.yml
name: Okra
kind: company
description: >-
  Okra was an open finance / open banking infrastructure company for Africa,
  headquartered in Lagos, Nigeria. Its REST APIs let businesses link end users'
  bank accounts (via the Okra Widget and a per-record "record" object) and then
  retrieve authenticated banking data - account and identity details, real-time
  balances, transaction history, and income - plus run KYC verifications (BVN,
  NUBAN, TIN, RC) and move money through bank-to-bank payments and direct debit
  authorizations. RETIRED: Okra quietly ceased operations in May 2025 and wound
  the company down; the API hosts (api.okra.ng, dash.okra.ng, docs.okra.ng,
  identity-api.okra.ng) no longer resolve and the okra.ng domain now serves an
  unrelated parked page. This entry documents the historical, now-discontinued
  API surface, grounded in Okra's official okraHQ/okra-node SDK and archived
  documentation.
