source: live DNS/TLS/HTTP probes of okra.ng and former Okra API/dev hosts
status: retired
retirementNote: >-
  Okra ceased operations in May 2025. Live probes on 2026-07-12 confirm the
  company's API and developer infrastructure is gone: api.okra.ng, dash.okra.ng,
  docs.okra.ng, and identity-api.okra.ng do not resolve (NXDOMAIN). The apex
  okra.ng now resolves to a HostPapa shared-hosting IP (23.94.150.194,
  wgh22.wghservers.com) on whogohost nameservers and returns a broken/parked
  WordPress page (HTTP 500 "Requirements Not Met"), presenting an EXPIRED Let's
  Encrypt certificate issued to an unrelated domain (CN=fggcowerrioga.com,
  expired 2023-07-19). This indicates the domain is no longer controlled/served
  by Okra. Treat all former endpoints as dead.
