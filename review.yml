aid: okra-africa
name: Okra
review:
  question: Does Okra expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Okra's documented public interface was a
    request/response REST API over HTTPS (base https://api.okra.ng/v2), together
    with a client-side account-linking Widget and server-to-server "app
    callbacks" / webhooks that HTTP POST link and data-refresh events to a
    business-configured URL. There is no documented server-push transport
    (WebSocket ws://|wss:// or SSE) on Okra's own API to model. In any case the
    service is retired: api.okra.ng no longer resolves.
status:
  lifecycle: retired
  ceasedOperations: '2025-05'
  reviewedLive: '2026-07-12'
  reachable: false
  note: |
    Okra ceased operations in May 2025. As of the review date the developer and
    API hosts (api.okra.ng, dash.okra.ng, docs.okra.ng, identity-api.okra.ng) do
    not resolve. The apex okra.ng resolves to a HostPapa/whogohost parked page
    presenting an expired Let's Encrypt certificate issued to an unrelated domain
    (CN=fggcowerrioga.com), confirming the domain is no longer operated by Okra.
findings:
  summary: |
    Okra did not publish a documented public WebSocket API. Okra was an open
    finance / open banking data + payments provider for Nigeria. Its public API
    was REST over HTTPS at base https://api.okra.ng/v2 (production) and
    https://api.okra.ng/v2/sandbox/ (sandbox), authenticated with an Okra Secret
    key sent as an HTTP Bearer token (Authorization: Bearer <secret>). Endpoints
    were predominantly POST, including read operations that accepted a JSON
    filter body. Account linking happened client-side via the Okra Widget, which
    produced record/customer identifiers; app callbacks (webhooks) delivered link
    and refresh events by server-to-server HTTP POST. No realtime, bidirectional,
    or streaming WebSocket endpoint was documented anywhere in Okra's SDK or
    reference docs. The company and its API are retired (shut down May 2025).
  openSource: |
    Okra's platform was proprietary/hosted. Okra published open-source client
    SDKs (github.com/okraHQ), including okra-node (Node.js), okra-python,
    okra-php, okra-flutter, and okra-js widget helpers. The Node SDK
    (okraHQ/okra-node) was archived read-only on 2024-02-09 and is the primary
    grounding source for base URL, auth, and endpoint paths in this entry.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.okra.ng/v2
      documented: true
      note: Production REST API. Sandbox base was https://api.okra.ng/v2/sandbox/. Retired - host no longer resolves.
    - protocol: Widget
      scheme: https
      documented: true
      note: Client-side Okra Widget link flow that produced the record/customer used by data endpoints. Not a server API transport.
    - protocol: Webhook
      scheme: https
      documented: true
      note: App callbacks POSTed link/refresh/data events to a business-configured URL. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint was documented in Okra's SDK or reference docs.
  endpointPrecision: |
    Endpoint PATHS and the base URL are CONFIRMED from Okra's official
    okraHQ/okra-node SDK (src/models/models.js, src/okra-client.js). The
    HTTP methods (POST-dominant) and Bearer auth are CONFIRMED from the SDK's
    req-wrapper.js. Request and response BODY SCHEMAS in the OpenAPI are MODELED
    (reconstructed from SDK parameter models and archived docs) and are
    illustrative, not authoritative. The live service could not be exercised
    because it is shut down.
