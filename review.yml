actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and Okra's own public API was
    request/response REST plus a client-side Widget and server-to-server
    webhooks. No AsyncAPI document was created because there is no documented
    server-push transport on Okra's API to model. The provider is retired; this
    entry preserves the historical, SDK-grounded API surface with modeled schemas
    clearly flagged.
