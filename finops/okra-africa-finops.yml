publisherName: Okra
serviceCategory: Financial Data and Payments
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Prepaid
  billingCurrency: NGN
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Okra Open Finance API
  ServiceCategory: Financial Data and Payments
  ProviderName: Okra
  PublisherName: Okra
  InvoiceIssuerName: Okra
  BillingCurrency: NGN
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: successful_api_calls
  description: Successful production API calls across data and payment products, billed per call above the free allowance.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - product
- name: connected_accounts
  description: Bank accounts linked through the Okra Widget, a primary billing driver.
  unit: connections
  aggregation: sum
  dimensions:
  - account
  - customer
- name: payment_transactions
  description: Bank-to-bank payments and direct-debit authorizations processed.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track successful calls per product and the count of connected accounts drawing down the prepaid wallet.
- name: Allocation
  description: Tag Okra customers/records to internal cost centers so connection and call spend maps to the feature that drove it.
- name: Optimization
  description: Cache retrieved data and avoid redundant refreshes; batch KYC checks; retire idle account connections to reduce recurring cost.
- name: Accountability
  description: Monitor billing-wallet balance and auto-top-up thresholds so paid production usage is not interrupted, and review monthly draw-down.
maintainers:
