description: >-
  HISTORICAL FinOps view of Okra spend. Okra's API was billed on a
  consumption basis - pay-as-you-go per successful API call and/or per connected
  bank account - settled from a prepaid billing wallet, above a free production
  allowance and free unlimited sandbox usage. Cost drivers were the number of
  linked accounts (connections) and the volume of successful data/payment calls
  across products (Auth, Accounts, Balance, Transactions, Identity, Income, KYC,
  Payments). Okra ceased operations in May 2025; there is no active invoice to
  manage. This record is retained for historical FinOps modeling only.
notes: >-
  Per-unit rates were not published by Okra and are not reconciled here. The
  provider is defunct (api.okra.ng no longer resolves), so no live billing data
  exists.
